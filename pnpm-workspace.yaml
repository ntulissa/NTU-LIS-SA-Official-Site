packages:
  - '.'

# 允許這兩個套件執行安裝腳本（消除 "Ignored build scripts" 警告）
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

# 'current' = 你現在這台電腦（例如 Mac），一定要保留，
# 否則在本機 pnpm install 時可能缺少 Mac 版的執行檔，導致 dev 跑不起來。
# linux 那幾行是給 Vercel 用的。
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc